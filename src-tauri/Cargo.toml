[package]
name = "rds-decomp"
version = "0.1.0"
edition = "2021"
description = "RetroDev Studio - Experimental Paired Decompilation Pipeline"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
hex = "0.4"
