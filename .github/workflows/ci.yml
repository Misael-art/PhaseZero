name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule 'PSUseShouldProcessForStateChangingFunctions','PSAvoidUsingInvokeExpression'
          if ($results) {
            $results | Format-Table -AutoSize
            # Treat only Error severity as blocking for now
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { exit 1 }
          }

  shell-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck on all shell scripts
        run: |
          set -euo pipefail
          EXCLUDES="SC1090,SC1091,SC2034,SC2154,SC2155,SC2312,SC2015,SC2016,SC2030,SC2031,SC2086,SC2119,SC2251"
          errors=0
          while IFS= read -r -d '' f; do
            if ! shellcheck -x -e "$EXCLUDES" "$f"; then
              ((errors++)) || true
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          if [ "$errors" -gt 0 ]; then
            echo "::warning::shellcheck: $errors file(s) failed (excludes: $EXCLUDES)"
            exit 1
          fi
          echo "shellcheck: all .sh files passed"

      - name: Check for pipefail + grep -q pattern
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            if grep -q 'set.*pipefail' "$f" 2>/dev/null && grep -q 'grep -q' "$f" 2>/dev/null; then
              echo "::warning file=$f::$f uses pipefail AND grep -q (SIGPIPE risk)"
              ((found++)) || true
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          echo "pipefail+grep-q files: $found"
          # Non-blocking — informational

  shell-test:
    runs-on: ubuntu-latest
    needs: shell-lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq bash

      - name: Unit-test common.sh functions
        run: |
          set -euo pipefail
          # shellcheck source=linux/lib/common.sh
          source linux/lib/common.sh
          # Smoke test pz_path_resolve
          result="$(pz_path_resolve "/nonexistent" "/bin" 2>/dev/null || true)"
          if [ -z "$result" ]; then
            echo "FAIL: pz_path_resolve returned empty"
            exit 1
          fi
          echo "PASS: pz_path_resolve returns $result"

      - name: Assert no unresolvable grep -q in critical files
        run: |
          set -euo pipefail
          bad=0
          for f in \
            linux/windows-vm/preflight.sh \
            linux/windows-vm/provision.sh \
            linux/windows-vm/windows-vm.sh \
            linux/audit/doctor.sh
          do
            if grep -q 'grep -q' "$f" 2>/dev/null; then
              echo "FAIL: $f still has grep -q (should be grep >/dev/null)"
              ((bad++)) || true
            fi
          done
          if [ "$bad" -gt 0 ]; then exit 1; fi
          echo "PASS: critical files free of grep -q"

  pester:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester 3.4.0 and PSScriptAnalyzer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse PowerShell
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $errors = @()
          foreach ($f in Get-ChildItem -Recurse -File -Include *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $errors += ("{0}:{1}: {2}" -f $f.FullName, $err.Extent.StartLineNumber, $err.Message)
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run Pester
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Path .\tests -EnableExit
