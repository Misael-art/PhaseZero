# PhaseZero homelab-stack — camada CORE (leve). Rode via: docker compose -f docker-compose.homelab.yml up -d
# Segredos NUNCA inline: vêm do .env ao lado (gerado pelo componente homelab-stack) ou do ambiente.
# Exponha estes serviços apenas atrás do Tailscale; não publique HTTP cru na WAN.
name: phasezero-homelab

services:
  # Camada amigável de gestão (equivalente ao CasaOS/Umbrel no Windows/WSL2)
  portainer:
    image: ${PZ_IMAGE_PORTAINER:-portainer/portainer-ce:2.33.2}
    container_name: phasezero-portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  # Servidor de mídia
  jellyfin:
    image: ${PZ_IMAGE_JELLYFIN:-jellyfin/jellyfin:10.10.7}
    container_name: phasezero-jellyfin
    restart: unless-stopped
    ports:
      - "${HOMELAB_PUBLIC_BIND_ADDR:-127.0.0.1}:8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${HOMELAB_MEDIA_DIR:-./media}:/media

  # "Drive" leve (sync P2P) — alternativa de baixo RAM ao Nextcloud
  syncthing:
    image: ${PZ_IMAGE_SYNCTHING:-syncthing/syncthing:1.29.6}
    container_name: phasezero-syncthing
    restart: unless-stopped
    hostname: phasezero-syncthing
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:8384:8384"
      - "${HOMELAB_PUBLIC_BIND_ADDR:-127.0.0.1}:22000:22000/tcp"
      - "${HOMELAB_PUBLIC_BIND_ADDR:-127.0.0.1}:22000:22000/udp"
    volumes:
      - syncthing_data:/var/syncthing

  # Cofre de senhas (Bitwarden-compatível). Só atrás de Tailscale/HTTPS.
  vaultwarden:
    image: ${PZ_IMAGE_VAULTWARDEN:-vaultwarden/server:1.34.3}
    container_name: phasezero-vaultwarden
    restart: unless-stopped
    environment:
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=${VW_SIGNUPS_ALLOWED:-false}
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:8222:80"
    volumes:
      - vaultwarden_data:/data

  # Monitoramento de uptime + alertas (camada "self-healing" amigável)
  uptime-kuma:
    image: ${PZ_IMAGE_UPTIME_KUMA:-louislam/uptime-kuma:1.23.16}
    container_name: phasezero-uptime-kuma
    restart: unless-stopped
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:3001:3001"
    volumes:
      - uptimekuma_data:/app/data

volumes:
  portainer_data:
  jellyfin_config:
  jellyfin_cache:
  syncthing_data:
  vaultwarden_data:
  uptimekuma_data:
